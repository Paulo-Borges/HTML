<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone/babel.min.js"></script>
    <!-- <script src="https://unpkg.com/@tailwindcss/browser@4"></script> -->

    <script type="text/babel">
      function ListNames() {
        const [names] = React.useState([
          "Borges",
          "Julia",
          "Ingryd",
          "Beth",
          "Heloisa",
          "Perola",
          "Anthi",
        ]);
        const [search, setSearch] = React.useState("");

        return (
          <div>
            <input
              type="text"
              value={search}
              onChange={(e) => setSearch(e.target.value)}
              placeholder="Search..."
            />

            <ul>
              {names
                .filter((n) => n.toLowerCase().includes(search.toLowerCase()))
                .map((n, index) => (
                  <li key={index}>{n}</li>
                ))}
            </ul>
          </div>
        );
      }

      const CounterContext = React.createContext();

      function CounterProvider({ children }) {
        const [savedCount, setSavedCount] = React.useState([]);

        function saveCount(count) {
          setSavedCount((prev) => [...prev, count]);
        }

        return (
          <CounterContext.Provider value={{ savedCount, saveCount }}>
            {children}
          </CounterContext.Provider>
        );
      }

      function Counter() {
        const [count, setCount] = React.useState(0);
        const [name, setName] = React.useState("");
        const { saveCount } = React.useContext(CounterContext);

        React.useEffect(() => {
          if (count > 0) {
            console.log("Componente montado!", count);
          }
        }, [count]);

        React.useEffect(() => {
          console.log("Count or name Atualizados:", count, name);
        }, [count, name]);

        return (
          <div>
            <div>
              <label>Nome: </label>
              <input
                type="text"
                value={name}
                onChange={(e) => setName(e.target.value)}
                placeholder="Enter your name"
              />
            </div>

            <p>Counter : {count}</p>
            {count % 2 === 0 ? <p>Par</p> : <p>Ímpar</p>}
            {count > 18 && <p>Maior de idade</p>}
            {count < 18 && <p>Menor de idade</p>}
            <button onClick={() => setCount((preValue) => preValue + 2)}>
              Atualizar
            </button>
            <button onClick={() => setCount((preValue) => preValue - 1)}>
              Diminuir
            </button>
            <button onClick={() => saveCount(count)}>Salvar </button>
          </div>
        );
      }

      function CounterList() {
        const { savedCount } = React.useContext(CounterContext);

        return (
          <div>
            <h2> Valores Salvos</h2>
            <ul>
              {savedCount.map((count, index) => (
                <li key={index}>{count}</li>
              ))}
            </ul>
          </div>
        );
      }

      function App() {
        return (
          <main className="bg-gray-200 p-4">
            <h1 className="text-2xl font-bold bg-orange-500">
              Hello, React 55!
            </h1>
            <CounterProvider>
              <Counter />
              <hr />
              <CounterList />
            </CounterProvider>
            <ListNames />
          </main>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
